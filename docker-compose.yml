services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-swiss_trafic}
      POSTGRES_USER: ${POSTGRES_USER:-gtfs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gtfs} -d ${POSTGRES_DB:-swiss_trafic}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
